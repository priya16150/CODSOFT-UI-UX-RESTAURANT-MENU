<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fork & Flame · Phone Menu</title>
  <!-- Google Fonts: Syne + DM Sans (same as example) -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0A0A0F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    /* ---------- ANIMATIONS (same style as reference) ---------- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* ----- scrollbar (like example) ----- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.4); border-radius: 99px; }

    /* ----- phone frame ----- */
    .phone-frame {
      width: 390px;
      min-height: 780px;
      background: linear-gradient(160deg, #12121A 0%, #0D0D15 100%);
      border-radius: 44px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 8px #16161F, 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px);
    }
    .phone-frame::-webkit-scrollbar { width: 3px; }

    /* notch */
    .notch {
      width: 126px;
      height: 36px;
      background: #0A0A0F;
      border-radius: 0 0 20px 20px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* ambient glow */
    .ambient-glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 70%);
      pointer-events: none;
      border-radius: 50%;
    }

    /* content wrapper */
    .content {
      flex: 1;
      padding: 20px 24px 32px;
      position: relative;
    }

    /* header */
    .logo-area h1 {
      font-size: 28px;
      font-weight: 800;
      font-family: 'Syne', sans-serif;
      background: linear-gradient(135deg, #F97316, #EA580C);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    .logo-area p {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* cart summary pill */
    .cart-preview {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .cart-preview i {
      color: #F97316;
      font-size: 18px;
    }
    .cart-preview span {
      font-size: 14px;
      font-weight: 600;
      color: white;
    }

    /* search box */
    .search-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 18px;
      transition: all 0.2s;
    }
    .search-box:focus-within {
      border-color: rgba(249, 115, 22, 0.5);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }
    .search-box i {
      color: #F97316;
      font-size: 16px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
    }
    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* categories scroll */
    .categories-scroll {
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 24px;
      padding-bottom: 6px;
    }
    .chip-group {
      display: inline-flex;
      gap: 10px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      color: rgba(255, 255, 255, 0.6);
    }
    .chip.active {
      background: linear-gradient(135deg, #F97316, #EA580C);
      border-color: transparent;
      color: white;
      box-shadow: 0 6px 14px rgba(249, 115, 22, 0.25);
    }

    /* menu grid */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 28px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.5s ease forwards;
    }
    .menu-card:hover {
      transform: translateY(-3px);
      border-color: rgba(249, 115, 22, 0.3);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }
    .card-img {
      height: 120px;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.08), rgba(234, 88, 12, 0.02));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .card-content {
      padding: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .card-header h3 {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      color: white;
    }
    .price {
      font-weight: 800;
      font-size: 18px;
      color: #F97316;
    }
    .meta {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin: 6px 0;
    }
    .rating {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0;
    }
    .stars {
      color: #FBBF24;
      letter-spacing: 2px;
      font-size: 12px;
    }
    .desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.4;
      margin: 8px 0 14px;
    }
    .card-actions {
      display: flex;
      gap: 12px;
    }
    .btn-view, .btn-cart {
      flex: 1;
      border: none;
      padding: 10px 0;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-view {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.7);
    }
    .btn-cart {
      background: linear-gradient(135deg, #F97316, #EA580C);
      color: white;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }
    .btn-view:active, .btn-cart:active { transform: scale(0.96); }

    /* recent section */
    .recent-section {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 28px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .recent-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #F97316;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .recent-scroll {
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 6px;
    }
    .recent-row {
      display: inline-flex;
      gap: 12px;
    }
    .recent-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 60px;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .recent-emoji {
      font-size: 20px;
    }
    .recent-info p {
      font-weight: 600;
      font-size: 13px;
      color: white;
    }
    .chef-note {
      margin-top: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(249, 115, 22, 0.08);
      padding: 12px;
      border-radius: 20px;
      border-left: 3px solid #F97316;
      line-height: 1.45;
    }

    /* bottom cart bar (fixed inside phone) */
    .bottom-cart-bar {
      background: rgba(18, 18, 26, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      border-radius: 32px 32px 0 0;
    }
    .cart-summary {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .cart-summary span:first-child {
      background: rgba(249, 115, 22, 0.15);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
      color: #F97316;
    }
    .cart-total-amount {
      font-weight: 800;
      font-size: 20px;
      color: white;
    }
    .view-cart-btn {
      background: #F97316;
      border: none;
      padding: 8px 20px;
      border-radius: 60px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    /* cart drawer */
    .cart-drawer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 390px;
      background: #12121A;
      border-radius: 32px 32px 0 0;
      z-index: 200;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cart-drawer.open {
      transform: translateX(-50%) translateY(0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .close-drawer {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.6);
    }
    .cart-items-list {
      max-height: 45vh;
      overflow-y: auto;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .cart-item-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .cart-item-actions button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #F97316;
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 18px;
      color: white;
      margin: 16px 0;
      padding-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
    }
    .clear-cart-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      padding: 12px;
      border-radius: 60px;
      font-weight: 600;
      color: #F97316;
      margin-top: 8px;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 150;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .empty-cart-msg { text-align: center; color: rgba(255, 255, 255, 0.4); padding: 24px; }
    .empty-recent { color: rgba(255, 255, 255, 0.3); font-size: 12px; }
  </style>
</head>
<body>
<div style="position: relative;">
  <div class="phone-frame">
    <div class="ambient-glow"></div>
    <div class="notch"></div>
    <div class="content">
      <!-- header + cart preview -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="logo-area">
          <h1>Fork & Flame<span style="color:#F97316;">.</span></h1>
          <p>artisan kitchen</p>
        </div>
        <div class="cart-preview" id="cartPreviewBtn">
          <i class="fas fa-shopping-bag"></i>
          <span id="cartCountBadge">0</span>
          <span id="cartTotalPreview">$0</span>
        </div>
      </div>

      <!-- search -->
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search pancakes, meat, drinks...">
      </div>

      <!-- categories -->
      <div class="categories-scroll">
        <div class="chip-group" id="filterChips"></div>
      </div>

      <!-- menu grid -->
      <div id="menuGrid" class="menu-grid"></div>

      <!-- recently viewed + chef note -->
      <div class="recent-section">
        <div class="recent-header"><i class="fas fa-clock"></i> <span>Recently Viewed</span></div>
        <div class="recent-scroll">
          <div class="recent-row" id="recentRow"></div>
        </div>
        <div class="chef-note">
          <i class="fas fa-pancakes"></i> As a rule, pancakes are served for breakfast with sweet sauces, chocolate, berries, maple syrup. Pancakes were a very popular breakfast only in the USA and Canada, but now pancakes are enjoyed all over the world.
        </div>
      </div>
    </div>

    <!-- bottom bar -->
    <div class="bottom-cart-bar">
      <div class="cart-summary">
        <span><i class="fas fa-bag-shopping"></i> <span id="bottomItemCount">0</span> items</span>
        <span class="cart-total-amount" id="bottomTotal">$0.00</span>
      </div>
      <button class="view-cart-btn" id="openDrawerBtn"><i class="fas fa-eye"></i> Cart</button>
    </div>
  </div>

  <!-- drawer overlay & cart drawer -->
  <div class="overlay" id="drawerOverlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <span>🛒 Your order</span>
      <button class="close-drawer" id="closeDrawerBtn">&times;</button>
    </div>
    <div id="cartItemsDrawer"></div>
    <div id="cartTotalDrawer" class="cart-total"></div>
    <button id="clearCartDrawerBtn" class="clear-cart-btn">Clear cart</button>
  </div>
</div>

<script>
  // ---------- MENU DATA (matching screenshot) ----------
  const menuData = [
    { id: 1, name: "Pear & Orange", category: "Breakfast", time: "20 min", price: 25.00, rating: 4.8, description: "Fluffy pearl pancakes with fresh pear slices & orange zest, honey drizzle.", emoji: "🍐🍊" },
    { id: 2, name: "Meat & Mashrooms", category: "Lunch", time: "30 min", price: 37.00, rating: 4.7, description: "Tender beef medallions, wild mushrooms, creamy herb sauce.", emoji: "🥩🍄" },
    { id: 3, name: "Egg & Bread", category: "Breakfast", time: "10 min", price: 25.00, rating: 4.6, description: "Two sunny eggs, sourdough toast, avocado spread & chili flakes.", emoji: "🍳🥑" },
    { id: 4, name: "Sweet pancake", category: "Treats", time: "10 min", price: 13.00, rating: 4.9, description: "Fluffy buttermilk pancakes with maple syrup & whipped butter.", emoji: "🥞🍯" },
    { id: 5, name: "Chocolate Brownie", category: "Dessert", time: "15 min", price: 9.00, rating: 4.8, description: "Warm fudge brownie, vanilla bean ice cream, chocolate drizzle.", emoji: "🍫🍨" },
    { id: 6, name: "Iced Caramel Latte", category: "Drink", time: "5 min", price: 7.00, rating: 4.5, description: "Smooth espresso, caramel, oat milk & whipped cream.", emoji: "☕🧋" },
    { id: 7, name: "Greek Salad Bowl", category: "Lunch", time: "12 min", price: 16.00, rating: 4.6, description: "Cucumber, olives, feta, oregano vinaigrette.", emoji: "🥗🧀" },
    { id: 8, name: "Berry Parfait", category: "Treats", time: "6 min", price: 11.00, rating: 4.7, description: "Greek yogurt, granola, honey & berries.", emoji: "🫐🍯" },
    { id: 9, name: "Cheesecake Supreme", category: "Dessert", time: "0 min", price: 12.00, rating: 4.9, description: "New york style cheesecake, raspberry coulis.", emoji: "🍰🍓" },
    { id: 10, name: "Spiced Orange Juice", category: "Drink", time: "4 min", price: 6.00, rating: 4.4, description: "Fresh orange juice with cinnamon twist.", emoji: "🍊🧃" }
  ];

  const categories = ["All", "Breakfast", "Lunch", "Treats", "Dessert", "Drink"];
  let activeCategory = "All";
  let searchQuery = "";
  let cart = []; // { id, name, price, quantity }
  let recentlyViewed = []; // max 4 items

  // DOM elements
  const menuGrid = document.getElementById("menuGrid");
  const filterChips = document.getElementById("filterChips");
  const searchInput = document.getElementById("searchInput");
  const cartCountBadge = document.getElementById("cartCountBadge");
  const cartTotalPreview = document.getElementById("cartTotalPreview");
  const bottomItemCount = document.getElementById("bottomItemCount");
  const bottomTotal = document.getElementById("bottomTotal");
  const cartItemsDrawer = document.getElementById("cartItemsDrawer");
  const cartTotalDrawer = document.getElementById("cartTotalDrawer");
  const recentRow = document.getElementById("recentRow");
  const drawer = document.getElementById("cartDrawer");
  const overlay = document.getElementById("drawerOverlay");

  // helper: update all cart UI
  function updateCartUI() {
    const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
    const itemCount = cart.reduce((sum, i) => sum + i.quantity, 0);
    cartCountBadge.innerText = itemCount;
    cartTotalPreview.innerText = `$${total.toFixed(2)}`;
    bottomItemCount.innerText = itemCount;
    bottomTotal.innerText = `$${total.toFixed(2)}`;
    renderCartDrawer();
  }

  function addToCart(item) {
    const existing = cart.find(i => i.id === item.id);
    if (existing) existing.quantity++;
    else cart.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
    updateCartUI();
  }

  function adjustQuantity(id, delta) {
    const idx = cart.findIndex(i => i.id === id);
    if (idx !== -1) {
      const newQty = cart[idx].quantity + delta;
      if (newQty <= 0) cart.splice(idx, 1);
      else cart[idx].quantity = newQty;
      updateCartUI();
    }
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    updateCartUI();
  }

  function clearCart() {
    cart = [];
    updateCartUI();
    if (drawer.classList.contains('open')) drawer.classList.remove('open');
    overlay.classList.remove('active');
  }

  function renderCartDrawer() {
    if (cart.length === 0) {
      cartItemsDrawer.innerHTML = `<div class="empty-cart-msg">✨ Cart is empty · add delicious items</div>`;
      cartTotalDrawer.innerHTML = "";
      return;
    }
    let html = `<div class="cart-items-list">`;
    let total = 0;
    cart.forEach(item => {
      total += item.price * item.quantity;
      html += `
        <div class="cart-item">
          <div><strong>${item.name}</strong><br><small style="color:#F97316;">$${item.price.toFixed(2)} x ${item.quantity}</small></div>
          <div class="cart-item-actions">
            <button class="cart-dec" data-id="${item.id}"><i class="fas fa-minus-circle"></i></button>
            <span style="font-weight:600; color:white;">${item.quantity}</span>
            <button class="cart-inc" data-id="${item.id}"><i class="fas fa-plus-circle"></i></button>
            <button class="cart-remove" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    cartItemsDrawer.innerHTML = html;
    cartTotalDrawer.innerHTML = `<span>Total</span><span>$${total.toFixed(2)}</span>`;
    // attach events
    document.querySelectorAll('.cart-inc').forEach(btn => btn.addEventListener('click', (e) => adjustQuantity(parseInt(btn.dataset.id), 1)));
    document.querySelectorAll('.cart-dec').forEach(btn => btn.addEventListener('click', (e) => adjustQuantity(parseInt(btn.dataset.id), -1)));
    document.querySelectorAll('.cart-remove').forEach(btn => btn.addEventListener('click', (e) => removeFromCart(parseInt(btn.dataset.id))));
  }

  // recently viewed
  function addToRecentlyViewed(item) {
    recentlyViewed = recentlyViewed.filter(i => i.id !== item.id);
    recentlyViewed.unshift({ id: item.id, name: item.name, price: item.price, emoji: item.emoji });
    if (recentlyViewed.length > 4) recentlyViewed.pop();
    renderRecentlyViewed();
  }

  function renderRecentlyViewed() {
    if (recentlyViewed.length === 0) {
      recentRow.innerHTML = `<div class="empty-recent">👆 Tap "View" on any dish</div>`;
      return;
    }
    recentRow.innerHTML = recentlyViewed.map(r => `
      <div class="recent-card">
        <div class="recent-emoji">${r.emoji || "🍽️"}</div>
        <div class="recent-info"><p>${r.name}</p></div>
      </div>
    `).join('');
  }

  // filter & render menu
  function getFilteredItems() {
    let filtered = [...menuData];
    if (activeCategory !== "All") filtered = filtered.filter(i => i.category === activeCategory);
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(i => i.name.toLowerCase().includes(q) || i.description.toLowerCase().includes(q));
    }
    return filtered;
  }

  function renderMenu() {
    const items = getFilteredItems();
    if (items.length === 0) {
      menuGrid.innerHTML = `<div class="empty-cart-msg" style="padding:32px;">🍽️ No dishes match · try another search</div>`;
      return;
    }
    menuGrid.innerHTML = items.map(item => `
      <div class="menu-card" style="animation: fadeUp 0.4s ease forwards;">
        <div class="card-img">${item.emoji}</div>
        <div class="card-content">
          <div class="card-header"><h3>${item.name}</h3><span class="price">$${item.price.toFixed(2)}</span></div>
          <div class="meta"><span><i class="far fa-clock"></i> ${item.time}</span><span><i class="fas fa-tag"></i> ${item.category}</span></div>
          <div class="rating"><span class="stars">${'★'.repeat(Math.floor(item.rating))}${item.rating % 1 >= 0.5 ? '½' : ''}${'☆'.repeat(5 - Math.ceil(item.rating))}</span> ${item.rating}</div>
          <div class="desc">${item.description}</div>
          <div class="card-actions">
            <button class="btn-view" data-id="${item.id}"><i class="fas fa-eye"></i> View</button>
            <button class="btn-cart" data-id="${item.id}"><i class="fas fa-cart-plus"></i> Add</button>
          </div>
        </div>
      </div>
    `).join('');
    // bind view & add
    document.querySelectorAll('.btn-view').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        const found = menuData.find(i => i.id === id);
        if (found) addToRecentlyViewed(found);
      });
    });
    document.querySelectorAll('.btn-cart').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        const found = menuData.find(i => i.id === id);
        if (found) addToCart(found);
      });
    });
  }

  // render filter chips
  function renderFilters() {
    filterChips.innerHTML = "";
    categories.forEach(cat => {
      const chip = document.createElement("span");
      chip.classList.add("chip");
      if (cat === activeCategory) chip.classList.add("active");
      chip.textContent = cat;
      chip.addEventListener("click", () => {
        activeCategory = cat;
        renderFilters();
        renderMenu();
      });
      filterChips.appendChild(chip);
    });
  }

  // drawer controls
  function openDrawer() { drawer.classList.add("open"); overlay.classList.add("active"); }
  function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("active"); }

  // event listeners
  searchInput.addEventListener("input", (e) => { searchQuery = e.target.value; renderMenu(); });
  document.getElementById("openDrawerBtn").addEventListener("click", openDrawer);
  document.getElementById("cartPreviewBtn").addEventListener("click", openDrawer);
  document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
  overlay.addEventListener("click", closeDrawer);
  document.getElementById("clearCartDrawerBtn").addEventListener("click", () => { clearCart(); if(cart.length===0) closeDrawer(); });

  // init
  renderFilters();
  renderMenu();
  updateCartUI();
  renderRecentlyViewed();
</script>
</body>
</html>
